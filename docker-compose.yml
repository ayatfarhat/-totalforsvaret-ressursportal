# Definerer containerne som trengs for å kjøre løsningen.
# Start med: docker compose up --build
services:
  # Webapplikasjonen (ASP.NET Core MVC)
  web:
    # Bygger containeren fra Dockerfile i denne mappa
    build: .
    # Kobler port 8080 på egen maskin til port 8080 i containeren,
    # slik at appen kan åpnes på http://localhost:8080
    ports:
      - "8080:8080"
    # Development gir detaljerte feilmeldinger under utvikling
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
